name: Publicar Lumora

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Preparar pacote completo, quando enviado por upload
        run: |
          if [ -f Lumora-Codigo-Completo.zip ]; then
            unzip -q -o Lumora-Codigo-Completo.zip -d "$RUNNER_TEMP/lumora-package"
            if [ -f src/index.html ]; then
              mkdir -p dist
              cp -R "$RUNNER_TEMP/lumora-package/dist/vendor" dist/vendor
            else
              cp -a "$RUNNER_TEMP/lumora-package/." .
            fi
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node build.mjs
      - run: node --test --test-isolation=none tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
